<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library - Books</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Library Management System</h1>

    <div th:if="${message}" class="message">
        <span th:text="${message}"></span>
    </div>

    <a href="/books/add" class="btn btn-primary">
        + Add Book
    </a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Category</th>
            <th>ISBN</th>
            <th>Price</th>
            <th>Published Date</th>
            <th>Available</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="book : ${books}">

            <td th:text="${book.id}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.category}"></td>
            <td th:text="${book.isbn}"></td>
            <td th:text="${book.price}"></td>
            <td th:text="${book.publishedDate}"></td>

            <td>
                <span th:if="${book.available}" class="available">
                    Available
                </span>

                <span th:unless="${book.available}" class="unavailable">
                    Borrowed
                </span>
            </td>

            <td>
                <a th:href="@{/books/edit/{id}(id=${book.id})}"
                   class="btn btn-edit">
                    Edit
                </a>

                <a th:href="@{/books/delete/{id}(id=${book.id})}"
                   class="btn btn-delete">
                    Delete
                </a>
            </td>

        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
