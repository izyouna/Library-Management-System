<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Add New Book</h1>

    <form th:action="@{/books/save}"
          th:object="${book}"
          method="post">

        <label>Title</label>
        <input type="text"
               th:field="*{title}"
               required>

        <label>Author</label>
        <input type="text"
               th:field="*{author}"
               required>

        <label>Category</label>
        <input type="text"
               th:field="*{category}"
               required>

        <label>ISBN</label>
        <input type="text"
               th:field="*{isbn}"
               required>

        <label>Price</label>
        <input type="number"
               step="0.01"
               th:field="*{price}"
               required>

        <label>Published Date</label>
        <input type="date"
               th:field="*{publishedDate}"
               required>

        <label>Available</label>
        <select th:field="*{available}">
            <option value="true">Available</option>
            <option value="false">Borrowed</option>
        </select>

        <div class="actions">

            <button type="submit"
                    class="btn btn-primary">
                Save
            </button>

            <a href="/books"
               class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
